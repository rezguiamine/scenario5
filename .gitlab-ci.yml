stages:
  - test
  - deploy

tests:
  stage: test

  parallel:
    matrix:
      - PYTHON_VERSION:
          - "3.10"
          - "3.11"
          - "3.12"

  image: python:${PYTHON_VERSION}-slim

  before_script:
    - pip install -r app/requirements.txt
    - pip install pytest pytest-cov

  script:
    - pytest test_app.py --cov=app --cov-report=xml:coverage.xml

  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying release ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'